# Conda 环境配置文件
# 用于转向标志识别与车辆控制系统

name: Intelligent-Vehicle-System-Based-on-Visual-Recognition
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip>=21.0
  - numpy>=1.19.0
  - pillow>=8.0.0
  - matplotlib>=3.3.0
  - tqdm>=4.60.0
  - pip:
    - opencv-python>=4.5.0
    - torch>=1.9.0
    - torchvision>=0.10.0
    - pyserial>=3.5
    - pygame>=2.0.0
